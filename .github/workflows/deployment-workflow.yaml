name: Deploy hit.lib.unb.ca

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  deploy:
    uses: unb-libraries/github-workflows/.github/workflows/build-push-deploy-notify.yaml@harden
    with:
      check-logs: true
      log-check-profile: 'drupal'
      branch-env-map: '{"dev":"dev","prod":"prod"}'
      deploy-branches: '["dev","prod"]'
      image-name: 'ghcr.io/unb-libraries/hit.lib.unb.ca'
      k8s-deployment-name: 'hit-lib-unb-ca'
      build-themes: true
      platforms: linux/amd64
      pre-build-command: 'mkdir -p custom/extra && echo hi > custom/extra/x.txt'
      pre-build-outputs: 'custom/extra/*.txt'
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_DATA }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GH_CONTAINER_REGISTRY_USER: ${{ secrets.GH_CONTAINER_REGISTRY_USER }}
      GH_CONTAINER_REGISTRY_TOKEN: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}
